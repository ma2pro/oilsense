#
# Supabase の無料プロジェクトは7日間の低活動で自動休止する。公式ドキュメントに
# 「活動」の定義はなく、回避策として明示されているのは有料プランのみ。
#
# 第1版は records への GET を送っていたが、RLS により 401 で拒否される読み取り
# だったため活動とみなされず、毎日実行していたにもかかわらず最後の実測定から
# 8日後(2026-10-29)に休止した。
#
# そこで専用テーブルへ「成功する INSERT」を送る方式に変更する。拒否される読み取り
# とは質的に異なるため、活動として数えられる見込みが高い。有効かどうかは8日以上
# 休止しないことで判断する。
#
# 事前に supabase/heartbeats.sql を SQL Editor で実行しておくこと。
#
# 失敗時はジョブを失敗させる。GitHub の通知で休止や障害に気づくための監視を兼ねる。
#
name: Supabase keepalive

on:
  schedule:
    # 毎日 03:17 UTC（日本時間 12:17）
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row
        env:
          # 公開鍵（Publishable key）。RLS で INSERT のみ許可しており、
          # 露出しても他人のデータは読めず消せない。秘密情報ではない。
          SUPABASE_URL: https://plignoxmvvrvktygqowu.supabase.co
          SUPABASE_KEY: sb_publishable_qTsNo2hG56DmfLw_LEZSNQ_uLNNfyNA
        run: |
          set -u
          URL="${SUPABASE_URL}/rest/v1/heartbeats"
          code=000
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                     -X POST \
                     -H "apikey: ${SUPABASE_KEY}" \
                     -H "Authorization: Bearer ${SUPABASE_KEY}" \
                     -H "Content-Type: application/json" \
                     -H "Prefer: return=minimal" \
                     --data '{"source":"github-actions"}' \
                     "$URL" || echo 000)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "Heartbeat written. Supabase project is awake."
              exit 0
            fi
            # 404 はテーブル未作成。リトライしても無駄なので即座に終わる
            if [ "$code" = "404" ]; then
              echo "::error::heartbeats テーブルが存在しません。supabase/heartbeats.sql を SQL Editor で実行してください"
              exit 1
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::Supabase に到達できません（最終 HTTP ${code}）。プロジェクトが休止した可能性があります: ${SUPABASE_URL}"
          exit 1
